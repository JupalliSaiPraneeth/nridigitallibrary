# High Availability Upstream API Cluster
upstream library_api {
    least_conn;

    # API Server 1 (Primary Node)
    server 192.168.X.X:5000 max_fails=3 fail_timeout=30s;

    # API Server 2 (Secondary Node / Failover)
    server 192.168.X.X:5000 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# HTTP → HTTPS Permanent Redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.library.college.edu;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Reverse Proxy & Load Balancer
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.library.college.edu;

    # TLS Certificates (Let's Encrypt or Cloudflare Origin Cert)
    ssl_certificate /etc/ssl/certs/api.library.college.edu.crt;
    ssl_certificate_key /etc/ssl/private/api.library.college.edu.key;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum upload / request payload size
    client_max_body_size 50M;

    # Proxy settings for API cluster
    location / {
        proxy_pass http://library_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for large file streaming
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Disable proxy buffering for large PDF/EPUB range request streaming
        proxy_buffering off;

        # Pass HTTP Range headers for PDF seeking
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Dedicated Health Check Location for NGINX/Cloudflare Monitors
    location = /api/health {
        proxy_pass http://library_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}
