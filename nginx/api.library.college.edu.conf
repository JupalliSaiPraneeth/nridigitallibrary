# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR COLLEGE DIGITAL LIBRARY SERVER
# ==============================================================================
# Domain:       api.library.college.edu (or your custom domain)
# Target:       Node.js Express (port 5000) or FastAPI (port 8000)
# Optimization: 75GB+ PDF Streaming with HTTP Byte-Range Seeking (RFC 7233)
# ==============================================================================

# Upstream Backend API Service
upstream college_library_backend {
    # If NGINX is installed on the same College Server:
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    
    # If using multiple backend instances or secondary failover node:
    # server 192.168.1.51:5000 backup;

    keepalive 64;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Redirect to HTTPS (or handled by Cloudflare Tunnel)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.library.college.edu api.yourdomain.com;

    # Allow Let's Encrypt ACME challenge if not using Cloudflare
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all plaintext traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Reverse Proxy to College Backend
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.library.college.edu api.yourdomain.com;

    # SSL Certificates (Cloudflare Origin Certificate or Let's Encrypt)
    # Windows: C:/nginx/ssl/cert.pem
    # Linux:   /etc/ssl/certs/api.library.college.edu.crt
    ssl_certificate /etc/ssl/certs/api.library.college.edu.crt;
    ssl_certificate_key /etc/ssl/private/api.library.college.edu.key;

    # TLS Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum Request Payload (allow book ingestion uploads)
    client_max_body_size 250M;

    # --------------------------------------------------------------------------
    # Health Check Endpoints (For Cloudflare Health Monitors / Load Balancer)
    # --------------------------------------------------------------------------
    location ~ ^/(health|api/health)$ {
        proxy_pass http://college_library_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # API & Book File Streaming (Crucial for 75GB+ PDF Seek & Partial Range)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://college_library_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # CRITICAL STREAMING SETTINGS:
        # 1. Disable proxy buffering so chunks stream directly to client without filling RAM
        proxy_buffering off;
        proxy_request_buffering off;

        # 2. Pass Range Headers for in-PDF seeking (e.g. jumping directly to Page 200)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # 3. Extended Timeouts for large multi-hundred-megabyte PDF downloads
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 4. Expose Range Headers to the client browser
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Disposition" always;
    }
}
